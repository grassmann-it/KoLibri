name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux is the reference platform. Windows and macOS report results but do not block until they are green.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build KoLibri.slnx -c Release
      - name: Test
        run: dotnet test tests/KoLibri.Core.Tests/KoLibri.Core.Tests.csproj -c Release --no-build

  package-smoke:
    name: package ${{ matrix.rid }}
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }}
      - name: Run the packaged CLI and MCP server
        shell: bash
        run: |
          d=$(ls -d dist/KoLibri-*-${{ matrix.rid }})
          "$d/kolibri" --help | head -3
          "$d/kolibri-mcp" --port 8799 & pid=$!
          sleep 5
          curl -fsS http://127.0.0.1:8799/.well-known/oauth-protected-resource
          kill $pid
