name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Linux is the reference platform. Windows and macOS report results but do not block until they are green.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build KoLibri.slnx -c Release
      - name: Test
        run: dotnet test tests/KoLibri.Core.Tests/KoLibri.Core.Tests.csproj -c Release --no-build

  package-smoke:
    name: package ${{ matrix.rid }}
    needs: build-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }}
      - name: Run the packaged CLI and MCP server
        shell: bash
        timeout-minutes: 6
        run: |
          set -x
          d=$(ls -d dist/KoLibri-*-${{ matrix.rid }})
          ls -l "$d"
          "$d/kolibri" --help < /dev/null > help.txt 2>&1 &
          hp=$!
          for i in $(seq 1 15); do
            sleep 10
            if ! kill -0 $hp 2>/dev/null; then echo "kolibri --help finished after about $((i*10))s"; break; fi
          done
          echo "--- help.txt:"; head -5 help.txt || true
          ps -p $hp || echo "kolibri --help already finished"
          kill $hp 2>/dev/null || true
          taskkill //F //IM kolibri.exe 2>/dev/null || true
          # Detach the server from the step's output, otherwise Windows and macOS runners wait for it forever.
          "$d/kolibri-mcp" --port 8799 > mcp.log 2>&1 < /dev/null &
          pid=$!
          sleep 5
          code=0
          curl -fsS http://127.0.0.1:8799/.well-known/oauth-protected-resource || code=$?
          kill $pid 2>/dev/null || true
          taskkill //F //IM kolibri-mcp.exe 2>/dev/null || true
          cat mcp.log
          exit $code
