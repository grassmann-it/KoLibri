name: Release

# Push a tag like v0.4.0 to build the programs for every platform and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check that the tag matches the project version
        shell: bash
        run: |
          version=$(sed -n 's:.*<KoLibriVersion>\(.*\)</KoLibriVersion>.*:\1:p' Directory.Build.props)
          echo "Directory.Build.props version: $version, tag: ${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_NAME}" == "v$version" ]] || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.rid }}
      - name: Package smoke (unpacked CLI starts)
        shell: bash
        run: |
          d=$(ls -d dist/KoLibri-*-${{ matrix.rid }})
          # The runner can start its own architecture only (osx-x64 is built on an arm64 runner and is not started).
          if [[ "${{ matrix.rid }}" != "osx-x64" ]]; then "$d/kolibri" --help < /dev/null | head -3; fi
      - name: Archive
        shell: bash
        run: |
          cd dist
          d=$(ls -d KoLibri-*-${{ matrix.rid }})
          if [[ "${{ matrix.rid }}" == win-* ]]; then 7z a "$d.zip" "$d"; else tar -czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the archives (four platforms, one version, one commit)
        run: |
          ls -l artifacts
          test "$(ls artifacts | wc -l)" -eq 4
          v="${GITHUB_REF_NAME#v}"
          for rid in linux-x64 win-x64 osx-arm64 osx-x64; do ls artifacts | grep -q "^KoLibri-$v-$rid\." || { echo "missing archive for $rid $v"; exit 1; }; done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" \
            --title "KoLibri ${{ github.ref_name }} (early alpha)" --generate-notes --draft --prerelease
